name: security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  cloudguard:
    # Replace with the cloudguard reusable workflow branch or tag (for example v1)
    uses: avniijain/cloudguard/.github/workflows/cloudguard.yml@REPLACE_WITH_BRANCH_OR_TAG
    with:
      image-name: demo-repo
      test-install-command: pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      test-command: pytest -v --cov=app --cov-report=xml --cov-report=term
      # Replace with your SonarCloud/SonarQube organization key
      sonar-organization: REPLACE_WITH_SONAR_ORG
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
